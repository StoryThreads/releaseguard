spring:
  config:
    import: optional:file:../.env[.properties]

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:releaseguard-analysis}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer

  application:
    name: releaseguard-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

github:
  token: ${GITHUB_TOKEN:}
  api-url: ${GITHUB_API_URL:https://api.github.com}

releaseguard:
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    model-version: ${ML_MODEL_VERSION:2.0.0}
  redis:
    enabled: ${REDIS_ENABLED:true}
    ttls:
      idempotency-processing-seconds: 300
      idempotency-completed-seconds: 86400
      github-diff-seconds: 3600
      prediction-result-seconds: 86400
    rate-limiter:
      enabled: ${REDIS_RATE_LIMITER_ENABLED:false}
      requests-per-minute: 60
