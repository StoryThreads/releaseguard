name: ReleaseGuard CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-build:
    name: Backend Build & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: releaseguard
          POSTGRES_USER: releaseguard
          POSTGRES_PASSWORD: releaseguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U releaseguard -d releaseguard"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      DB_URL: jdbc:postgresql://localhost:5432/releaseguard
      DB_USERNAME: releaseguard
      DB_PASSWORD: releaseguard
      GITHUB_TOKEN: ${{ secrets.RELEASEGUARD_GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install AI service dependencies
        working-directory: ai-service
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run AI service tests
        working-directory: ai-service
        run: python -m pytest -q

      - name: Build XGBoost model artifact
        working-directory: ai-service
        run: python scripts/train_xgboost.py

      - name: Start AI prediction service
        working-directory: ai-service
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/releaseguard-ai-service.log 2>&1 &

      - name: Wait for AI prediction service
        working-directory: ai-service
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/releaseguard-ai-health.json; then
              cat /tmp/releaseguard-ai-health.json
              exit 0
            fi
            sleep 2
          done

          echo "AI service failed to become healthy."
          cat /tmp/releaseguard-ai-service.log || true
          exit 1

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and test backend
        run: ./mvnw clean verify
        env:
          ML_SERVICE_URL: http://127.0.0.1:8000

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
